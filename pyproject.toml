[project]
name = "flet-printing"
version = "0.1.0"
description = "Native print dialog / share sheet for Flet apps — wraps the Flutter printing package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "aiseed-dev" }
]
keywords = ["flet", "flutter", "printing", "print", "pdf"]
dependencies = [
    "flet>=0.85.3",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://github.com/aiseed-dev/flet-printing"
Documentation = "https://github.com/aiseed-dev/flet-printing"
Repository = "https://github.com/aiseed-dev/flet-printing"
Issues = "https://github.com/aiseed-dev/flet-printing/issues"

[tool.setuptools.package-data]
"flutter.flet_printing" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
